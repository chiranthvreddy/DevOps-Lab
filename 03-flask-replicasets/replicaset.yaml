apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: flask-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-rs
  template:
    metadata:
      labels:
        app: flask-rs
    spec:
      containers:
        - name: flask
          image: devops-flask:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
