apiVersion: apps/v1
kind: Deployment
metadata: {name: flask-app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: flask-app}
  template:
    metadata:
      labels: {app: flask-app}
    spec:
      containers:
        - name: flask
          image: devops-flask:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 2
