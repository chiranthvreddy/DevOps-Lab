apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: catalog}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: catalog
          image: devops-catalog:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata: {name: catalog}
spec:
  type: NodePort
  selector: {app: catalog}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cart}
spec:
  replicas: 3
  selector:
    matchLabels: {app: cart}
  template:
    metadata:
      labels: {app: cart}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: cart}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cart
          image: devops-cart:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata: {name: cart}
spec:
  type: NodePort
  selector: {app: cart}
  ports: [{port: 5000, targetPort: 5000}]
